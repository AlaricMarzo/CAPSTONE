[phases.setup]
nixPkgs = ["...", "python3", "python3Packages.pip", "python3Packages.setuptools"]

[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r backend/requirements.txt",
  "npm run install:all"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"

[variables]
VITE_FIREBASE_API_KEY = "secret:VITE_FIREBASE_API_KEY"
VITE_FIREBASE_AUTH_DOMAIN = "secret:VITE_FIREBASE_AUTH_DOMAIN"
VITE_FIREBASE_PROJECT_ID = "secret:VITE_FIREBASE_PROJECT_ID"
VITE_FIREBASE_APP_ID = "secret:VITE_FIREBASE_APP_ID"
VITE_FIREBASE_MESSAGING_SENDER_ID = "secret:VITE_FIREBASE_MESSAGING_SENDER_ID"
VITE_FIREBASE_STORAGE_BUCKET = "secret:VITE_FIREBASE_STORAGE_BUCKET"
VITE_FIREBASE_MEASUREMENT_ID = "secret:VITE_FIREBASE_MEASUREMENT_ID"
DATABASE_URL = "secret:DATABASE_URL"
